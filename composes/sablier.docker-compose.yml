x-common-deploy: &common-deploy
  restart_policy:
    condition: on-failure
    delay: 5s
    window: 120s
x-common-env: &common-env
  PGID: 1000
  PUID: 1000
  TZ: Europe/Paris

networks:
  public:
    external: true

services:
  sablier:
    cap_drop:
      - "ALL"
    command:
      - start
      - --provider.name=docker_swarm
      - --sessions.default-duration=1m
      - --strategy.dynamic.default-theme=ghost
      - --strategy.dynamic.show-details-by-default=false
      - --logging.level=debug
    deploy:
      !!merge <<: *common-deploy
    environment:
      !!merge <<: *common-env
    image: sablierapp/sablier:1.19.1@sha256:c24b7198f6c552252db61d2e9daa5ac5d604d3fd0ccb852a76156be4b19d2114
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock